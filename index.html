<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>羽彤的小窩</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="script.js"></script>
    <script defer src="manifestation.js"></script>
</head>
<body>
    <header>
        <h1>羽彤的小窩</h1>
        <p>✨ 歡迎來到我的小世界 ✨</p>
        <button id="toggle-theme">切換模式</button>
        <button id="toggle-style">變換風格</button>
    </header>

    <canvas id="stars"></canvas> <!-- 星空背景 -->

    <nav>
        <ul>
            <li><a href="#journal">日記 & 思考</a></li>
            <li><a href="#manifestation">願望記錄</a></li>
            <li><a href="#quotes">詩歌 & 靈感</a></li>
            <li><a href="#games">遊戲 & 動漫</a></li>
            <li><a href="#about">關於我</a></li>
        </ul>
    </nav>

    <section id="journal">
        <h2>📖 日記 & 思考</h2>
        <button id="random-journal">顯示隨機日記</button>
        <p id="journal-content">點擊按鈕，看看過去的某個想法 ✨</p>
    </section>

    <section id="manifestation">
        <h2>🌠 許願瓶</h2>
        <button id="random-wish">抽取一個願望</button>
        <p id="wish-content">點擊按鈕，看看你的願望 💫</p>
    </section>

    <section id="quotes">
        <h2>📜 詩歌 & 靈感</h2>
        <p id="quote-content">"世界是一本打開的詩集..."</p>
    </section>

    <section id="games">
        <h2>🎮 遊戲 & 動漫</h2>
        <p>這裡將展示我的愛好和喜歡的作品！</p>
    </section>

    <section id="interactive">
        <h2>💬 留言板</h2>
        <button id="random-message">查看隨機留言</button>
        <p id="message-content">這裡會顯示一條來自宇宙的話語。</p>
    </section>

    <section id="about">
        <h2>💫 關於我</h2>
        <p>這是一個記錄著我的小天地，希望你能感受到溫暖。</p>
    </section>

    <footer>
        <p>© 2025 羽彤的小窩 | 由羽彤手工打造</p>
    </footer>
</body>
</html>
